name: CI

# ESTE WORKFLOW NO CORRIÓ NUNCA, y nadie se enteró.
#
# Decía `branches: [main]`, y este repositorio NO TIENE una rama `main`: la
# única rama es la de trabajo, que además es la rama por defecto. Con ese
# filtro, cada push se salteaba el linter y los tests en silencio — y un CI que
# no corre es peor que no tener CI, porque la pestaña Actions en verde (vacía)
# se lee como "pasó todo".
#
# `["**"]` corre en cualquier rama, que es lo que hay que querer acá: la rama
# de trabajo cambia de nombre en cada tanda y un filtro por nombre se vuelve a
# desincronizar. Es el mismo disparador que ya usa `apps.yml`.
on:
  push:
    branches: ["**"]
  pull_request:

# Un push encima de otro cancela la corrida vieja: sin esto, empujar tres veces
# seguidas deja tres corridas compitiendo y la que termina última no es
# necesariamente la del último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motor:
    name: Linter y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # NSIS para que `test_el_script_del_instalador_compila` COMPILE de verdad
      # el script del instalador en vez de saltearse. Sin esto el test hace
      # `skip` y la pestaña queda verde sin haber probado nada — el mismo
      # engaño que el filtro de ramas de arriba, en chiquito.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - run: ruff check .
      - run: python3 -m pytest -q tests/

  frontend:
    name: Build del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
        working-directory: webapp/frontend
      - run: npm run build
        working-directory: webapp/frontend

  demo:
    name: Humo — la demo levanta y responde
    runs-on: ubuntu-latest
    # Que los tests pasen no garantiza que el servidor arranque: el seed real
    # escribe un .db de varios MB y ya se rompió una vez por una ruta relativa
    # que sólo fallaba fuera de pytest.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Levantar el backend y sembrar la demo
        run: |
          python3 -m uvicorn webapp.backend.api:app --port 8820 &
          for i in $(seq 1 60); do
            sleep 1
            curl -sf http://127.0.0.1:8820/api/salud > /dev/null && break
          done
          curl -sf http://127.0.0.1:8820/api/salud | tee /tmp/salud.json
          grep -q '"ok":true' /tmp/salud.json
      - name: Las cuentas de prueba entran
        run: |
          for email in vieraschiavi@gmail.com arcortito@gmail.com; do
            token=$(curl -sf -X POST http://127.0.0.1:8820/api/login \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"$email\",\"clave\":\"matcher2026\"}" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
            test -n "$token"
            # Y el deck de esa cuenta trae perfiles: una demo que entra pero
            # muestra el deck vacío no sirve para nada.
            curl -sf http://127.0.0.1:8820/api/deck?limite=5 \
              -H "Authorization: Bearer $token" \
              | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["tarjetas"], "deck vacío"; print(len(d["tarjetas"]), "tarjetas para '"$email"'")'
          done
